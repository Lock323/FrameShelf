<div id="watched_movies_page_part_content" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-4">
    {% for content in watched_movie_content %}
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <img
                src="/proxy/image/w200{{ content.poster_path }}"
                alt="{{ content.title }}"
                class="w-full h-80 object-contain bg-gray-200"
                onclick="window.location.href='/{{ content.media_type }}/page/{{ content.id }}'"
            >
            <div class="p-2">
                <h2 class="text-sm font-semibold text-gray-800 truncate">{{ content.title }}</h2>
                <div class="flex justify-between text-xs text-gray-600">
                    <span>{{ content.release_date[0:4] }}</span>
                    <span>⭐ {{ content.vote_average }}</span>
                    <span>{{ content.media_type }}</span>
                </div>
                {{ content.buttons | safe }}
            </div>
        </div>
    {% endfor %}
</div>

<div
hx-swap-oob="outerHTML:#bottom-trigger"
id="bottom-trigger"
hx-get="/home/watched_movies_page_part"
hx-vals='{"offset": {{ offset }}, "limit": {{ limit }}}'
hx-trigger="intersect once threshold:0.5"
hx-target="#watched_movies_page_part"
hx-swap="beforeend"
hx-indicator="#bottom-indicator">
<span id="bottom-indicator" class="htmx-indicator">Loading...</span>
</div>
