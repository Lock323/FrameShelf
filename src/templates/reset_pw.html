{% extends "base.html" %}

{% block head %}
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
<script src="https://unpkg.com/htmx.org@1.9.11/dist/ext/json-enc.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/response-targets.js"></script>
<script src="/static/pw_visibility.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-[300px] mx-auto p-5" hx-ext="response-targets">
  <form
    hx-put="/reset_pw"
    hx-ext='json-enc'
    hx-target="#ResponseText"
    hx-target-422="#ResponseText"
    hx-target-400="#ResponseText"
    hx-vals='{"user_email": "{{ user_email }}", "reset_pw_token": "{{ reset_pw_token }}"}'
  >

    <div class="relative mb-4">
      <input
        type="password"
        name="new_password"
        id="password"
        placeholder="new password"
        required
        autocomplete="off"
        class="w-full p-2.5 mb-2 text-gray-900 bg-white dark:text-gray-100 dark:bg-gray-800 border border-gray-300
        dark:border-gray-700 rounded-md"
      >
      <span
        class="absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer select-none text-lg"
        onclick="togglePasswordVisibility()"
      >
        &#9679;
      </span>
    </div>

    <button
      type="submit"
      class="w-full p-2.5 cursor-pointer text-gray-900 bg-white dark:text-gray-100 dark:bg-gray-800 border
      border-gray-300 dark:border-gray-700 rounded-md"
    >
      Change password
    </button>

    <div id="ResponseText" class="mt-2"></div>

  </form>
</div>

{% endblock %}
